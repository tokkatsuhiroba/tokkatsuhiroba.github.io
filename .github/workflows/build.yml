# 実践が1件増えたら、サイトを作り直して公開する
#
#   src/ に .md が増える（フォーム → Apps Script → ここにコミット）
#     ↓
#   python3 build.py         ← 検問はここで働く。止まれば公開もされない
#     ↓
#   公開用/*.html を GitHub Pages へ
#
# ★ 2026-09-21から、出来上がりは4枚です（ホーム・知る・学ぶ・集まる）。
#    index.html だけを上げると、押した先が全部404になります。
#    何枚になっても取りこぼさないよう、ここでは *.html をまとめて写します。
#
# ★ src/_ngword.txt はリポジトリに置きません（同僚の名前などが入るため）。
#    Actions の Secret「NGWORD」から、ビルドの直前に書き出します。

name: build

on:
  push:
    branches: [main]
    paths: ['src/**', 'build.py', '.github/workflows/build.yml']
  workflow_dispatch: {}

permissions:
  contents: write      # 送られたPDFを画像に変えて、その結果を書き戻すため
  pages: write
  id-token: write

# ★ cancel-in-progress を false にしています（2026-09-22 夜）。
#   1件 届くと、受け口は「写真」「写真」「.md」と **続けて3回** コミットします。
#   true だと、この3つが押し合って **.md を入れた回が打ち切られました**
#   （実測：23:53:14 打ち切り／:15 成功／:16 打ち切り。最後の .md の回が消え、
#     送っていただいた実践がサイトに出ないままでした）。
#   false にすると3回ぶん順番に走ります。むだに見えますが、**最後の回が
#   いちばん新しい状態を組む**ので、取りこぼしません。
#   1回1分ほど・1日に何件も来る場ではないので、これで困りません。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 履歴ぜんぶ。届いた実践の「並び」に使います（2026-09-22）。
          #   受け口が todoita: を書けていないものは、git に入った時こくで
          #   代わりにします（build.py の git_todoita）。浅い取りこみだと
          #   その時こくが取れず、新しいものが下に沈みます。
          #   ★いまの .git は 11MB です。ぜんぶ取っても数秒です。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 出してはいけない語の表を置く
        env:
          NGWORD: ${{ secrets.NGWORD }}
        run: |
          printf '%s\n' "$NGWORD" > src/_ngword.txt

      # ══ 送られたPDFを、画像に変える（2026-09-21 夜）════════════
      #   このサイトは「開いても外に1バイトも出ない」のが約束なので、
      #   PDFのまま貼ることはできません（外の閲覧器につながるため）。
      #   1ページ＝1枚のWebPにして、HTMLの中へ入れます。
      #   ★変えたら元のPDFは消し、結果を main に書き戻します。
      #     書き戻しは GITHUB_TOKEN で押すので、**次のビルドは走りません**
      #     （GitHubがそう決めています）。だから、ぐるぐる回りません。
      #     公開するぶんは、この回の build が画像にしたあとで組んでいます。
      #   ★2026-09-21、2ページのPDFで実際に通しました（01.webp 02.webp）。
      - name: 送られたPDFを画像にする
        id: pdf
        run: |
          set -e
          shopt -s nullglob globstar
          pdfs=(src/shiryo/**/*.pdf)
          if [ ${#pdfs[@]} -eq 0 ]; then
            echo "PDFはありません"
            echo "kaeta=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils webp
          for f in "${pdfs[@]}"; do
            d=$(dirname "$f")
            echo "画像にします … $f"
            # 横1000pxくらい。110dpi なら A4 で ほぼその幅になります
            # -l 20 … 20ページまで。1件が重くなりすぎると板書のページ全体が入りません
            pdftoppm -r 110 -l 20 -png -aa yes -aaVector yes "$f" "$d/_p"
            i=0
            for png in "$d"/_p-*.png; do
              i=$((i+1))
              out=$(printf '%s/%02d.webp' "$d" "$i")
              cwebp -quiet -q 72 -resize 1000 0 "$png" -o "$out"
              rm -f "$png"
            done
            rm -f "$f"
            echo "  → ${i}枚にしました"
          done
          echo "kaeta=yes" >> "$GITHUB_OUTPUT"

      - name: 組み立てる（検問に引っかかったら、ここで止まる）
        run: python3 build.py

      - name: 画像にしたぶんを書き戻す
        if: steps.pdf.outputs.kaeta == 'yes'
        run: |
          git config user.name  'tokkatsu-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A src/shiryo
          git commit -m '送られたPDFを画像にする' || exit 0
          git push origin HEAD:main

      - name: 公開するものだけを取り出す
        run: |
          mkdir -p _site
          cp 公開用/*.html _site/
          # LINEに貼ったときの絵（2026-09-23 から2枚。ホーム用とお願い用）
          cp 公開用/ogp*.png _site/ 2>/dev/null || { echo '⚠ ogp*.png がありません'; exit 1; }
          # 検索に見つけてもらうための2枚（2026-09-23）。
          # ★ここで写さないと、robots.txt が無いのと同じになり、
          #   出さないと決めたページ（写真・困りごと・管理）も見に来られます。
          for f in sitemap.xml robots.txt; do
            if [ -f "公開用/$f" ]; then cp "公開用/$f" "_site/$f"; else
              echo "⚠ 公開用/$f がありません（検索よけが効きません）"; exit 1; fi
          done
          # PDFを塗る道具（pdf.js）。PDFを選んだ人だけが取りに行きます。
          # ページには入れていないので、ここで一緒に配らないと動きません。
          if [ -d 公開用/pdfjs ]; then cp -r 公開用/pdfjs _site/pdfjs; fi
          ls -l _site/pdfjs 2>/dev/null || echo '⚠ pdfjs がありません（PDFは塗れません）'

      - name: 押した先が欠けていないか数える
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          aru = sorted(os.path.basename(p) for p in glob.glob('_site/*.html'))
          print('公開するページ … ' + '、'.join(aru))
          if 'index.html' not in aru:
              sys.exit('✕ index.html がありません')
          nai = set()
          for p in glob.glob('_site/*.html'):
              s = open(p, encoding='utf-8').read()
              for h in re.findall('href="([^"#]+[.]html)', s):
                  if '://' in h:      # 外のサイトは、ここでは数えません
                      continue
                  if h not in aru:
                      nai.add(h)
          if nai:
              sys.exit('✕ 押した先が足りません … ' + '、'.join(sorted(nai)))
          print('★ 押した先は、ぜんぶそろっています')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
