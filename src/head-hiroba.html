<!-- 検索に出すかどうかは、**ページごと**に build.py が決めます（2026-09-23）。

<!-- ══ LINE・SNSで共有したときの見え方（OGP） ══ -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://tokkatsuhiroba.github.io/">
<meta property="og:site_name" content="TOKKATSU広場">
<meta property="og:title" content="TOKKATSU広場｜特別活動で、輝く。">
<meta property="og:description" content="ニュース・一次資料・研究日程・すぐ使える実践。LINEは話す場、ここは確かめて持ち帰る場です。">
<!-- 絵のアドレスに「?」を付けません（2026-09-23）。
     ？のうしろで版を上げると、取りに来る側がうまく読まないことがあります。
     差しかえるときは **ファイル名のほう**を変えてください（ogp-hiroba.png → ogp-hiroba2.png）。 -->
<meta property="og:image" content="https://tokkatsuhiroba.github.io/ogp-hiroba.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="4人のキャラクターが肩を組んでいる絵と「TOKKATSU広場｜特別活動の情報が、溜まる場。」の字">
<meta property="og:locale" content="ja_JP">
<!-- Twitterカードは、札（summary_large_image）だけ書いて 絵を書いていませんでした。
     そのせいで「大きい絵の札」と言いながら絵が無く、
     読む側が小さいサムネイルに落としていた可能性があります（2026-09-23）。
     ★og: と同じものを、こちらにも書きます。 -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://tokkatsuhiroba.github.io/ogp-hiroba.png">
<meta name="twitter:title" content="TOKKATSU広場｜特別活動で、輝く。">
<meta name="twitter:description" content="ニュース・一次資料・研究日程・すぐ使える実践。LINEは話す場、ここは確かめて持ち帰る場です。">
<meta name="description" content="特別活動で、輝く。ニュース・一次資料・学級会の学習過程・研究日程。">
<!-- ══ ホーム画面に追加したときの絵（2026-09-24 依頼）══════════
     何も書いていないと、iPhoneは **そのページを縮めた写真**を札にします。
     字がつぶれて、何のサイトか分からない灰色の四角になっていました。
     ★角は丸めていません。iPhoneが自分で丸めます（二度丸めると角が欠けます）。
     ★すき通らせていません。iPhoneは すき通ったところを黒くします。
     ★絵のアドレスに「?」を付けません（og:image と同じ約束）。
       差しかえるときは **ファイル名のほう**を変えてください
       （apple-touch-icon-180.png → apple-touch-icon-181.png）。
       名前を変えたら、src/icon/tsukuru.py と build.py の ICON_DIR のぶんも
       一緒に変わるので、直すのは ここの2行だけです。
     ★絵じたいは src/icon/tsukuru.py が作ります（学活くんが丸の中に立つ札）。 -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@400;600&family=Jost:wght@500;700&display=swap" rel="stylesheet">
<!-- ══ 字の大きさ（2026-09-23 依頼）══════════════════════════
     前に選んだ大きさを、**絵が出るより先に**入れます。
     下のほうで入れると、ふつうの大きさで一度出てから変わるので、
     開くたびに字がガクッと動いて見えます（実測で踏みました）。
     ★端末の中（localStorage）だけです。外へは1バイトも出ません（原則2）。
     ★読めないときは、何もしません（ふつうの大きさのまま）。 -->
<script>try{var m=localStorage.getItem('tokkatsu-moji');
if(m&&/^(chiisai|futsuu|ookii|totemo)$/.test(m))document.documentElement.setAttribute('data-moji',m);}catch(e){}</script>
